services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - tile_data:/app/data
    environment:
      - MAX_CONCURRENT_INFERENCE=2

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    volumes:
      - tile_data:/app/data
    depends_on:
      - api

volumes:
  tile_data:
